[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symsite-her"
version = "0.2.0"
description = "Symmetry-guided discovery and site-resolved bonding analysis of multimetallic single-atom HER catalysts"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "pandas>=2.2", "scipy>=1.10", "torch>=2.0",
    "scikit-learn>=1.3", "h5py>=3.8", "joblib>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["herald*"]
